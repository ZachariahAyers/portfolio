events {
    worker_connections 1024;
}

http {
    # Map subdomain to upstream
    map $host $backend {
        natours.zachayers.io 127.0.0.1:3002;
        lively.zachayers.io 127.0.0.1:5000;
        chalkboard.zachayers.io 127.0.0.1:3001;
        done-with-it-api.zachayers.io 127.0.0.1:9000;
        galaxymvc.zachayers.io 127.0.0.1:8081;
        modulefederation.zachayers.io 127.0.0.1:8080;
        default "";
    }

    # Use localhost since nginx and apps are on same host
    upstream natours {
        server localhost:3002;
    }

    upstream lively {
        server localhost:5000;
    }

    upstream chalkboard {
        server localhost:3001;
    }

    upstream done_with_it_api {
        server localhost:9000;
    }

    upstream galaxymvc {
        server localhost:8081;
    }

    upstream modulefederation {
        server localhost:8080;
    }

    # Server block for subdomain routing
    server {
        listen 80;
        server_name natours.zachayers.io lively.zachayers.io chalkboard.zachayers.io done-with-it-api.zachayers.io galaxymvc.zachayers.io modulefederation.zachayers.io;
        client_max_body_size 100M;

        location / {
            proxy_pass http://$backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Server block for IP/path-based routing
    server {
        listen 80 default_server;
        server_name _;
        client_max_body_size 100M;

        # Natours
        location /natours/ {
            proxy_pass http://natours/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /natours {
            return 301 /natours/;
        }

        # Lively
        location /lively/ {
            proxy_pass http://lively/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /lively {
            return 301 /lively/;
        }

        # Chalkboard
        location /chalkboard/ {
            proxy_pass http://chalkboard/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /chalkboard {
            return 301 /chalkboard/;
        }

        # Done-with-it API
        location /done-with-it-api/ {
            proxy_pass http://done_with_it_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /done-with-it-api {
            return 301 /done-with-it-api/;
        }

        # GalaxyMVC
        location /galaxymvc/ {
            proxy_pass http://galaxymvc/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /galaxymvc {
            return 301 /galaxymvc/;
        }

        # Module Federation
        location /modulefederation/ {
            proxy_pass http://modulefederation/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /modulefederation {
            return 301 /modulefederation/;
        }

        # Default root
        location / {
            return 200 'Portfolio Apps:\n
- /natours - Tour booking platform\n
- /lively - Event management app\n
- /chalkboard - Real-time collaboration\n
- /done-with-it-api - Task management API\n
- /galaxymvc - PHP MVC framework\n
- /modulefederation - Microfrontend showcase\n';
            add_header Content-Type text/plain;
        }
    }
}